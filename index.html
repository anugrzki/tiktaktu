<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOX Master Ultimate</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-x: #ef4444;
            --accent-o: #3b82f6;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 { 
            font-size: 2.2rem;
            color: #38bdf8;
            letter-spacing: 1px;
            margin-bottom: 20px; 
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.2); 
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .logo-box {
            width: 50px;
            height: 50px;
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            padding: 2px;
            flex-shrink: 0;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .brand-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.5px;
            margin-left: 6px;
        }

        .controls {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            border: 1px solid #334155;
        }

        select, button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        select:hover, button:hover { background: #475569; transform: translateY(-2px); }
        button.btn-reset { background: #e11d48; border: none; }
        button.btn-reset:hover { background: #be123c; }

        .scoreboard {
            display: flex;
            gap: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 10px 30px;
            border-radius: 30px;
            border: 1px solid #334155;
        }

        .score-x { color: var(--accent-x); }
        .score-o { color: var(--accent-o); }

        .board-container {
            max-width: 90vw;
            max-height: 60vh;
            overflow: auto;
            border: 2px solid #334155;
            border-radius: 12px;
            background: #020617;
            padding: 10px;
        }

        .board {
            display: grid;
            gap: 6px;
            margin: 0 auto;
        }

        .cell {
            background: var(--card-bg);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s, transform 0.1s;
        }

        .cell:hover { background: #334155; }
        .cell.x { color: #38bdf8; }
        .cell.o { color: #f43f5e; }
        .cell.winning { background: #059669 !important; color: white; }

        .status {
            font-size: 1.2rem;
            margin-top: 15px;
            font-weight: 600;
            height: 30px;
        }
    </style>
</head>
<body>

    <div class="logo-row">
        <div class="logo-box"><img src="l1.jpeg" alt="Logo 1"></div>
        <div class="logo-box"><img src="l2.jpeg" alt="Logo 2"></div>
        <div class="logo-box"><img src="l3.jpeg" alt="Logo 3"></div>
        <div class="logo-box"><img src="l4.jpeg" alt="Logo 4"></div>
        <div class="logo-box"><img src="l5.jpeg" alt="Logo 5"></div>
        <span class="brand-name">XOX Game</span>
    </div>

    <h1>XOX Master</h1>

    <div class="controls">
        <label>Ukuran: 
            <select id="grid-size" onchange="resetGame()">
                <option value="3">3 x 3 (Menang 3)</option>
                <option value="9">9 x 9 (Menang 5)</option>
                <option value="16">16 x 16 (Menang 5)</option>
                <option value="32">32 x 32 (Menang 5)</option>
            </select>
        </label>

        <label>Mode: 
            <select id="game-mode" onchange="resetGame()">
                <option value="pvp">2 Pemain (Lokal)</option>
                <option value="easy">VS AI (Mudah)</option>
                <option value="medium" selected>VS AI (Sedang)</option>
                <option value="hard">VS AI (Sulit)</option>
            </select>
        </label>

        <button class="btn-reset" onclick="resetGame()">Ronde Baru</button>
        <button onclick="resetScore()">Reset Skor</button>
    </div>

    <div class="scoreboard">
        <span class="score-x">Pemain X: <span id="score-x">0</span></span>
        <span class="score-o">Pemain O: <span id="score-o">0</span></span>
    </div>

    <div class="board-container">
        <div id="board" class="board"></div>
    </div>

    <div id="status" class="status">Giliran Pemain X</div>

    <script>
        let size = 3;
        let winCondition = 3;
        let boardState = [];
        let currentPlayer = 'X';
        let isGameActive = true;
        let scoreX = 0;
        let scoreO = 0;
        let autoResetTimeout = null; // Menyimpan ID timer untuk reset otomatis

        function initGame() {
            if (autoResetTimeout) clearTimeout(autoResetTimeout);

            size = parseInt(document.getElementById('grid-size').value);
            winCondition = size === 3 ? 3 : 5;
            boardState = Array(size * size).fill('');
            currentPlayer = 'X';
            isGameActive = true;
            
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${size}, ${getCellSize()}px)`;

            for (let i = 0; i < size * size; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.style.width = `${getCellSize()}px`;
                cell.style.height = `${getCellSize()}px`;
                cell.style.fontSize = `${getCellSize() * 0.6}px`;
                cell.dataset.index = i;
                cell.addEventListener('click', handleCellClick);
                boardEl.appendChild(cell);
            }

            document.getElementById('status').innerText = `Giliran Pemain ${currentPlayer}`;
        }

        function getCellSize() {
            if (size === 3) return 100;
            if (size === 9) return 45;
            if (size === 16) return 30;
            return 22;
        }

        function handleCellClick(e) {
            const index = e.target.dataset.index;
            if (boardState[index] !== '' || !isGameActive) return;

            makeMove(index, currentPlayer);

            if (isGameActive && document.getElementById('game-mode').value !== 'pvp' && currentPlayer === 'O') {
                setTimeout(aiMove, 200);
            }
        }

        function makeMove(index, player) {
            boardState[index] = player;
            const cell = document.querySelector(`[data-index='${index}']`);
            cell.innerText = player;
            cell.classList.add(player.toLowerCase());

            const winPattern = checkWin(index, player);
            if (winPattern) {
                endGame(false, winPattern);
            } else if (boardState.every(cell => cell !== '')) {
                endGame(true);
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                document.getElementById('status').innerText = `Giliran Pemain ${currentPlayer}`;
            }
        }

        function checkWin(lastIndex, player) {
            const row = Math.floor(lastIndex / size);
            const col = lastIndex % size;
            const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];

            for (let [dr, dc] of directions) {
                let count = 1;
                let winningCells = [parseInt(lastIndex)];

                for (let sign of [-1, 1]) {
                    let r = row + dr * sign;
                    let c = col + dc * sign;
                    while (r >= 0 && r < size && c >= 0 && c < size && boardState[r * size + c] === player) {
                        count++;
                        winningCells.push(r * size + c);
                        if (count >= winCondition) return winningCells;
                        r += dr * sign;
                        c += dc * sign;
                    }
                }
            }
            return null;
        }

        function endGame(draw, winPattern = null) {
            isGameActive = false;
            
            if (draw) {
                document.getElementById('status').innerText = 'Permainan Seri! Mengulang ronde...';
            } else {
                document.getElementById('status').innerText = `Pemain ${currentPlayer} Menang! Mengulang ronde...`;
                if (currentPlayer === 'X') scoreX++; else scoreO++;
                updateScoreboard();
                if (winPattern) {
                    winPattern.forEach(idx => {
                        document.querySelector(`[data-index='${idx}']`).classList.add('winning');
                    });
                }
            }

            // Ganti ronde otomatis setelah 1.5 detik
            autoResetTimeout = setTimeout(() => {
                initGame();
            }, 1500);
        }

        function aiMove() {
            if (!isGameActive) return;
            const mode = document.getElementById('game-mode').value;
            let move;

            if (mode === 'easy') {
                move = getRandomMove();
            } else if (mode === 'medium') {
                move = Math.random() < 0.5 ? getHeuristicMove() : getRandomMove();
            } else if (mode === 'hard') {
                if (size === 3) {
                    move = getBestMoveMinimax();
                } else {
                    move = getHeuristicMove();
                }
            }

            if (move !== null && move !== undefined) makeMove(move, 'O');
        }

        function getRandomMove() {
            const emptyIndices = boardState.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
            return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        }

        function getHeuristicMove() {
            let winMove = findBlockingOrWinningMove('O', winCondition - 1);
            if (winMove !== null) return winMove;

            let blockWinMove = findBlockingOrWinningMove('X', winCondition - 1);
            if (blockWinMove !== null) return blockWinMove;

            for (let targetCount = winCondition - 2; targetCount >= 2; targetCount--) {
                let blockThreat = findBlockingOrWinningMove('X', targetCount);
                if (blockThreat !== null) return blockThreat;
                
                let attackMove = findBlockingOrWinningMove('O', targetCount);
                if (attackMove !== null) return attackMove;
            }

            return getNeighborMove();
        }

        function findBlockingOrWinningMove(player, countNeeded) {
            const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];

            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] !== '') continue;

                const row = Math.floor(i / size);
                const col = i % size;

                for (let [dr, dc] of directions) {
                    let consecutive = 0;

                    let r = row + dr;
                    let c = col + dc;
                    while (r >= 0 && r < size && c >= 0 && c < size && boardState[r * size + c] === player) {
                        consecutive++;
                        r += dr;
                        c += dc;
                    }

                    r = row - dr;
                    c = col - dc;
                    while (r >= 0 && r < size && c >= 0 && c < size && boardState[r * size + c] === player) {
                        consecutive++;
                        r -= dr;
                        c -= dc;
                    }

                    if (consecutive >= countNeeded) {
                        return i;
                    }
                }
            }
            return null;
        }

        function getNeighborMove() {
            let candidates = [];
            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] !== '') {
                    const row = Math.floor(i / size);
                    const col = i % size;

                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let r = row + dr;
                            let c = col + dc;
                            if (r >= 0 && r < size && c >= 0 && c < size) {
                                let idx = r * size + c;
                                if (boardState[idx] === '' && !candidates.includes(idx)) {
                                    candidates.push(idx);
                                }
                            }
                        }
                    }
                }
            }

            if (candidates.length > 0) {
                return candidates[Math.floor(Math.random() * candidates.length)];
            }
            return getRandomMove();
        }

        function getBestMoveMinimax() {
            let bestScore = -Infinity;
            let bestMove = null;

            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] === '') {
                    boardState[i] = 'O';
                    let score = minimax(boardState, 0, false);
                    boardState[i] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            return bestMove;
        }

        function minimax(board, depth, isMaximizing) {
            let result = evaluateBoard();
            if (result !== null) {
                if (result === 'O') return 10 - depth;
                if (result === 'X') return depth - 10;
                if (result === 'tie') return 0;
            }

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = 'O';
                        let score = minimax(board, depth + 1, false);
                        board[i] = '';
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = 'X';
                        let score = minimax(board, depth + 1, true);
                        board[i] = '';
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function evaluateBoard() {
            const winLines = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            for (let line of winLines) {
                const [a, b, c] = line;
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    return boardState[a];
                }
            }

            if (boardState.every(cell => cell !== '')) return 'tie';
            return null;
        }

        function updateScoreboard() {
            document.getElementById('score-x').innerText = scoreX;
            document.getElementById('score-o').innerText = scoreO;
        }

        function resetGame() { initGame(); }

        function resetScore() {
            scoreX = 0;
            scoreO = 0;
            updateScoreboard();
            resetGame();
        }

        initGame();
    </script>
</body>
</html>
