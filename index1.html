<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game XOX dengan Level & Skor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    /* ------------------------------------
       1. KOTAK LOGO KIRI ATAS (5 LOGO)
    ------------------------------------ */
    .logo-corner {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      flex-wrap: wrap;
    }

    .logo-box {
      width: 45px;
      height: 45px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      padding: 2px;
      flex-shrink: 0;
    }

    /* Styling untuk gambar logo */
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .brand-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
      margin-left: 4px;
    }

    h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      letter-spacing: 1px;
      margin-bottom: 20px;
      margin-top: 10px;
    }

    /* ------------------------------------
       2. 5 KOTAK DI TENGAH (PANEL KONTROL & SKOR)
    ------------------------------------ */
    .five-boxes-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
      max-width: 680px;
      width: 100%;
    }

    .center-box {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px 14px;
      text-align: center;
      flex: 1 1 110px;
      min-width: 110px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 75px;
    }

    .center-box span {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .center-box strong {
      font-size: 1.4rem;
      color: #38bdf8;
    }

    /* Input Select di Dalam Kotak 1 */
    .center-box select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      width: 100%;
      text-align: center;
    }

    /* Tombol di Dalam Kotak 5 */
    .btn-box-action {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-box-action:hover {
      opacity: 0.9;
    }

    .btn-box-action:active {
      transform: scale(0.96);
    }

    /* Status Permainan */
    .status {
      font-size: 1.2rem;
      margin-bottom: 15px;
      height: 30px;
      font-weight: 600;
      color: #f1f5f9;
    }

    /* Board Tic Tac Toe */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
      background-color: #334155;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    .cell {
      background-color: #1e293b;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s, transform 0.1s;
    }

    .cell:hover {
      background-color: #334155;
    }

    .cell.x {
      color: #38bdf8;
    }

    .cell.o {
      color: #f43f5e;
    }

    .cell.winning {
      background-color: #059669;
      color: #ffffff;
    }

    /* Tombol Reset Semua Skor */
    .actions {
      margin-top: 20px;
    }

    .btn-clear-score {
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #475569;
      color: #f8fafc;
      transition: opacity 0.2s;
    }

    .btn-clear-score:hover {
      opacity: 0.9;
    }

    /* Penyesuaian Responsif Layar HP */
    @media (max-width: 600px) {
      .logo-corner {
        position: static;
        margin-bottom: 15px;
        justify-content: center;
      }
      h1 {
        margin-top: 0;
      }
      .five-boxes-container {
        gap: 8px;
      }
      .center-box {
        flex: 1 1 45%;
      }
    }
  </style>
</head>
<body>

  <!-- KOTAK LOGO KIRI ATAS (5 LOGO) -->
  <div class="logo-corner">
    <div class="logo-box"><img src="l1.jpeg" alt="Logo Game 1"></div>
    <div class="logo-box"><img src="l2.jpeg" alt="Logo Game 2"></div>
    <div class="logo-box"><img src="l3.jpeg" alt="Logo Game 3"></div>
    <div class="logo-box"><img src="l4.jpeg" alt="Logo Game 4"></div>
    <div class="logo-box"><img src="l5.jpeg" alt="Logo Game 5"></div>
    <span class="brand-name">XOX Game</span>
  </div>

  <h1>Game XOX</h1>

  <!-- 5 KOTAK BERADA DI TENGAH -->
  <div class="five-boxes-container">
    <div class="center-box">
      <span>Level</span>
      <select id="levelSelect">
        <option value="easy">Mudah</option>
        <option value="medium">Sedang</option>
        <option value="hard">Sulit</option>
      </select>
    </div>

    <div class="center-box">
      <span>Kamu (X)</span>
      <strong id="playerScore">0</strong>
    </div>

    <div class="center-box">
      <span>Seri</span>
      <strong id="drawScore">0</strong>
    </div>

    <div class="center-box">
      <span>Bot (O)</span>
      <strong id="aiScore">0</strong>
    </div>

    <div class="center-box">
      <span>Ronde</span>
      <button class="btn-box-action" id="resetBtn">Baru</button>
    </div>
  </div>

  <!-- Status Permainan -->
  <div class="status" id="statusText">Giliran Kamu (X)</div>

  <!-- Papan Permainan -->
  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <!-- Reset Semua Skor -->
  <div class="actions">
    <button class="btn-clear-score" id="clearScoreBtn">Reset Semua Skor</button>
  </div>

  <script>
    // Audio Context untuk efek suara sintetis
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'moveX') {
        // Suara klik Pemain X (NADA TINGGI SUASANA CERAH)
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1); // A5
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'moveO') {
        // Suara klik Bot O (NADA RENDAH BASS)
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'win') {
        // Efek Menang (FANFARE SEGERA)
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const oscW = audioCtx.createOscillator();
          const gainW = audioCtx.createGain();
          oscW.connect(gainW);
          gainW.connect(audioCtx.destination);

          oscW.type = 'triangle';
          oscW.frequency.value = freq;
          const start = now + (idx * 0.08);
          gainW.gain.setValueAtTime(0.3, start);
          gainW.gain.exponentialRampToValueAtTime(0.001, start + 0.25);
          oscW.start(start);
          oscW.stop(start + 0.25);
        });
      } else if (type === 'lose') {
        // Efek Kalah (NADA TURUN / BASS SAD)
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.4);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'draw') {
        // Efek Seri
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.setValueAtTime(400, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'reset') {
        // Efek Tombol Reset
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    }

    // State Permainan
    let boardState = ['', '', '', '', '', '', '', '', ''];
    let humanPlayer = 'X';
    let aiPlayer = 'O';
    let currentPlayer = humanPlayer;
    let isGameActive = true;
    let level = 'easy';

    let scores = {
      player: 0,
      draw: 0,
      ai: 0
    };

    const winningConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Baris
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Kolom
      [0, 4, 8], [2, 4, 6]              // Diagonal
    ];

    // Elemen DOM
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('statusText');
    const levelSelect = document.getElementById('levelSelect');
    const resetBtn = document.getElementById('resetBtn');
    const clearScoreBtn = document.getElementById('clearScoreBtn');
    const playerScoreEl = document.getElementById('playerScore');
    const drawScoreEl = document.getElementById('drawScore');
    const aiScoreEl = document.getElementById('aiScore');

    // Event Listeners
    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    levelSelect.addEventListener('change', handleLevelChange);
    resetBtn.addEventListener('click', () => { playSound('reset'); resetBoard(); });
    clearScoreBtn.addEventListener('click', () => { playSound('reset'); resetAllScore(); });

    function handleCellClick(e) {
      const index = e.target.getAttribute('data-index');

      if (boardState[index] !== '' || !isGameActive || currentPlayer !== humanPlayer) {
        return;
      }

      playSound('moveX');
      makeMove(index, humanPlayer);

      if (checkGameState(humanPlayer)) return;

      // Giliran Bot
      currentPlayer = aiPlayer;
      statusText.textContent = "Bot (O) sedang berpikir...";

      setTimeout(() => {
        if (isGameActive) {
          const aiMove = getAiMove();
          playSound('moveO');
          makeMove(aiMove, aiPlayer);
          if (!checkGameState(aiPlayer)) {
            currentPlayer = humanPlayer;
            statusText.textContent = "Giliran Kamu (X)";
          }
        }
      }, 400);
    }

    function makeMove(index, player) {
      boardState[index] = player;
      const cell = cells[index];
      cell.textContent = player;
      cell.classList.add(player.toLowerCase());
    }

    function checkGameState(player) {
      let roundWon = false;
      let winningCombo = null;

      for (let condition of winningConditions) {
        const [a, b, c] = condition;
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          roundWon = true;
          winningCombo = condition;
          break;
        }
      }

      if (roundWon) {
        isGameActive = false;
        highlightWinningCells(winningCombo);
        if (player === humanPlayer) {
          statusText.textContent = "Selamat! Kamu Menang! 🎉";
          scores.player++;
          playSound('win');
        } else {
          statusText.textContent = "Bot Menang! 🤖";
          scores.ai++;
          playSound('lose');
        }
        updateScoreboard();
        return true;
      }

      // Cek Seri
      if (!boardState.includes('')) {
        isGameActive = false;
        statusText.textContent = "Hasil Seri! 🤝";
        scores.draw++;
        playSound('draw');
        updateScoreboard();
        return true;
      }

      return false;
    }

    function highlightWinningCells(combo) {
      combo.forEach(idx => cells[idx].classList.add('winning'));
    }

    function updateScoreboard() {
      playerScoreEl.textContent = scores.player;
      drawScoreEl.textContent = scores.draw;
      aiScoreEl.textContent = scores.ai;
    }

    // --- LOGIKA BOT BERDASARKAN LEVEL ---
    function getAiMove() {
      const emptyIndices = getEmptyIndices(boardState);

      if (level === 'easy') {
        return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      } 
      
      if (level === 'medium') {
        for (let idx of emptyIndices) {
          let tempBoard = [...boardState];
          tempBoard[idx] = aiPlayer;
          if (isWinner(tempBoard, aiPlayer)) return idx;
        }
        for (let idx of emptyIndices) {
          let tempBoard = [...boardState];
          tempBoard[idx] = humanPlayer;
          if (isWinner(tempBoard, humanPlayer)) return idx;
        }
        return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      } 
      
      if (level === 'hard') {
        return minimax(boardState, aiPlayer).index;
      }
    }

    function getEmptyIndices(state) {
      return state.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
    }

    function isWinner(state, player) {
      return winningConditions.some(cond => {
        return cond.every(idx => state[idx] === player);
      });
    }

    function minimax(newBoard, player) {
      const availSpots = getEmptyIndices(newBoard);

      if (isWinner(newBoard, humanPlayer)) {
        return { score: -10 };
      } else if (isWinner(newBoard, aiPlayer)) {
        return { score: 10 };
      } else if (availSpots.length === 0) {
        return { score: 0 };
      }

      const moves = [];

      for (let i = 0; i < availSpots.length; i++) {
        const move = {};
        move.index = availSpots[i];
        newBoard[availSpots[i]] = player;

        if (player === aiPlayer) {
          const result = minimax(newBoard, humanPlayer);
          move.score = result.score;
        } else {
          const result = minimax(newBoard, aiPlayer);
          move.score = result.score;
        }

        newBoard[availSpots[i]] = '';
        moves.push(move);
      }

      let bestMove;
      if (player === aiPlayer) {
        let bestScore = -10000;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score > bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      } else {
        let bestScore = 10000;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score < bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      }

      return moves[bestMove];
    }

    function resetBoard() {
      boardState = ['', '', '', '', '', '', '', '', ''];
      isGameActive = true;
      currentPlayer = humanPlayer;
      statusText.textContent = "Giliran Kamu (X)";
      
      cells.forEach(cell => {
        cell.textContent = '';
        cell.className = 'cell';
      });
    }

    function handleLevelChange(e) {
      level = e.target.value;
      playSound('reset');
      resetBoard();
    }

    function resetAllScore() {
      scores = { player: 0, draw: 0, ai: 0 };
      updateScoreboard();
      resetBoard();
    }
  </script>
</body>
</html>
